name: Update Hastane Menu JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"   # 10 dakikada bir

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install googleapis
        run: npm i googleapis

      - name: Build JSON from Google Sheet
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: node scripts/update-hastane-menu.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add public/hastane-menu.json
          git commit -m "chore: update hastane menu" || echo "No changes"
          git push
