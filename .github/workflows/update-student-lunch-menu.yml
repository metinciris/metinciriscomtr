name: Update Student Lunch Menu

on:
  schedule:
    # 04:30 and 07:30 UTC is 07:30 and 10:30 Istanbul time
    - cron: '30 4 * * *'
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run fetch script
        run: node scripts/fetch-student-lunch-menu.mjs

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/ogrenci-ogle-menu.json
            git commit -m "Auto-update student lunch menu: $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No changes"
          fi
