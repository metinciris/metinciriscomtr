name: Update Euro Match Data

on:
  schedule:
    # Run twice daily: 09:00 and 21:00 Istanbul time (06:00 and 18:00 UTC)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================
      # FOOTBALL - football-data.org + fixturedownload
      # ============================================
      - name: Fetch Football Data
        id: football
        continue-on-error: true
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          echo "Fetching football data..."
          node scripts/fetch-football.js
          echo "status=success" >> $GITHUB_OUTPUT

      # ============================================
      # BASKETBALL - fixturedownload
      # ============================================
      - name: Fetch Basketball Data
        id: basketball
        continue-on-error: true
        run: |
          echo "Fetching basketball data..."
          node scripts/fetch-basketball.js
          echo "status=success" >> $GITHUB_OUTPUT

      # ============================================
      # VOLLEYBALL - api-football.com
      # ============================================
      - name: Fetch Volleyball Data
        id: volleyball
        continue-on-error: true
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          echo "Fetching volleyball data..."
          node scripts/fetch-volleyball.js
          echo "status=success" >> $GITHUB_OUTPUT

      # ============================================
      # UPDATE LAST_UPDATED.JSON (Using Node for reliability)
      # ============================================
      - name: Create last_updated.json
        run: |
          node -e '
            const fs = require("fs");
            const getCount = (path) => {
              try {
                if (!fs.existsSync(path)) return 0;
                const data = JSON.parse(fs.readFileSync(path, "utf8"));
                return Array.isArray(data) ? data.length : 0;
              } catch (e) { return 0; }
            };
            
            const timestamp = new Date().toISOString();
            const lastUpdated = {
              lastUpdated: timestamp,
              football: {
                status: "${{ steps.football.outcome }}" === "success" ? "success" : "error",
                matchCount: getCount("public/data/football.json"),
                updatedAt: timestamp
              },
              basketball: {
                status: "${{ steps.basketball.outcome }}" === "success" ? "success" : "error",
                matchCount: getCount("public/data/basketball.json"),
                updatedAt: timestamp
              },
              volleyball: {
                status: "${{ steps.volleyball.outcome }}" === "success" ? "success" : "error",
                matchCount: getCount("public/data/volleyball.json"),
                updatedAt: timestamp
              }
            };
            fs.writeFileSync("public/data/last_updated.json", JSON.stringify(lastUpdated, null, 2));
          '

      # ============================================
      # COMMIT & PUSH
      # ============================================
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add all data files
          git add public/data/football.json public/data/basketball.json public/data/volleyball.json public/data/last_updated.json
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update euro match data [skip ci]"
            git push
            echo "Changes committed and pushed"
          fi
