name: Update Euro Match Data

on:
  schedule:
    # Run twice daily: 09:00 and 21:00 Istanbul time (06:00 and 18:00 UTC)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================
      # FOOTBALL - football-data.org
      # ============================================
      - name: Fetch Football Data
        id: football
        continue-on-error: true
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          echo "Fetching football data..."
          node scripts/fetch-football.js
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Check Football Result
        if: steps.football.outcome == 'failure'
        run: |
          echo "Football fetch failed, keeping existing data"
          echo '{"sport":"football","status":"error","error":"API fetch failed","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > /tmp/football_error.json

      # ============================================
      # BASKETBALL - api-football.com
      # ============================================
      - name: Fetch Basketball Data
        id: basketball
        continue-on-error: true
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          echo "Fetching basketball data..."
          node scripts/fetch-basketball.js
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Check Basketball Result
        if: steps.basketball.outcome == 'failure'
        run: |
          echo "Basketball fetch failed, keeping existing data"
          echo '{"sport":"basketball","status":"error","error":"API fetch failed","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > /tmp/basketball_error.json

      # ============================================
      # VOLLEYBALL - api-football.com
      # ============================================
      - name: Fetch Volleyball Data
        id: volleyball
        continue-on-error: true
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          echo "Fetching volleyball data..."
          node scripts/fetch-volleyball.js
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Check Volleyball Result
        if: steps.volleyball.outcome == 'failure'
        run: |
          echo "Volleyball fetch failed, keeping existing data"
          echo '{"sport":"volleyball","status":"error","error":"API fetch failed","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > /tmp/volleyball_error.json

      # ============================================
      # UPDATE LAST_UPDATED.JSON
      # ============================================
      - name: Create last_updated.json
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          # Count matches in each file
          FOOTBALL_COUNT=0
          BASKETBALL_COUNT=0
          VOLLEYBALL_COUNT=0
          
          if [ -f "public/data/football.json" ]; then
            FOOTBALL_COUNT=$(cat public/data/football.json | grep -c '"id":' || echo 0)
          fi
          
          if [ -f "public/data/basketball.json" ]; then
            BASKETBALL_COUNT=$(cat public/data/basketball.json | grep -c '"id":' || echo 0)
          fi
          
          if [ -f "public/data/volleyball.json" ]; then
            VOLLEYBALL_COUNT=$(cat public/data/volleyball.json | grep -c '"id":' || echo 0)
          fi
          
          # Build JSON
          cat > public/data/last_updated.json << EOF
          {
            "lastUpdated": "$TIMESTAMP",
            "football": {
              "status": "${{ steps.football.outcome == 'success' && 'success' || 'error' }}",
              "matchCount": $FOOTBALL_COUNT,
              "updatedAt": "$TIMESTAMP"
            },
            "basketball": {
              "status": "${{ steps.basketball.outcome == 'success' && 'success' || 'error' }}",
              "matchCount": $BASKETBALL_COUNT,
              "updatedAt": "$TIMESTAMP"
            },
            "volleyball": {
              "status": "${{ steps.volleyball.outcome == 'success' && 'success' || 'error' }}",
              "matchCount": $VOLLEYBALL_COUNT,
              "updatedAt": "$TIMESTAMP"
            }
          }
          EOF
          
          echo "Created last_updated.json:"
          cat public/data/last_updated.json

      # ============================================
      # COMMIT & PUSH
      # ============================================
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add all data files
          git add public/data/football.json public/data/basketball.json public/data/volleyball.json public/data/last_updated.json
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update euro match data [skip ci]"
            git push
            echo "Changes committed and pushed"
          fi
