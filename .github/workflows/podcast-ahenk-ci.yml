name: Verify Podcast Ahenk Cep
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/Podcast.tsx'
      - 'src/lib/ahenkCep.ts'
      - 'src/lib/ahenkPronunciation.ts'
      - 'src/lib/ahenkPronunciation.test.ts'
      - 'src/lib/podcastScroll.ts'
      - 'src/lib/podcastScroll.test.ts'
      - 'src/lib/podcastPreparedAudio.ts'
      - 'src/lib/podcastPreparedAudio.test.ts'
      - 'src/lib/podcastPronunciationOverrides.ts'
      - 'src/lib/podcastPronunciationOverrides.test.ts'
      - 'scripts/podcast_audio_pronunciation.py'
      - 'scripts/test_podcast_audio_pronunciation.py'
      - 'windows/podcast-ahenk/**'
      - 'public/podcast-audio/pronunciation.json'
      - 'scripts/render_podcast_audio.py'
      - 'scripts/test_render_podcast_audio.py'
      - '.github/workflows/podcast-audio.yml'
      - 'docs/PODCAST-HAZIR-SES.md'
      - 'public/ahenk-cep/**'
      - 'docs/PODCAST-AHENK-CEP.md'
      - 'index.html'
      - 'netlify.toml'
      - '.github/workflows/podcast-ahenk-ci.yml'

permissions:
  contents: read
  issues: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Check lint
        run: npm run lint
      - name: Check podcast pronunciation and scroll placement
        run: npm run test -- src/lib/ahenkPronunciation.test.ts src/lib/podcastScroll.test.ts src/lib/podcastPreparedAudio.test.ts src/lib/podcastPronunciationOverrides.test.ts
      - name: Check Python podcast batch generation and sheet parsing
        run: python3 -m unittest scripts.test_render_podcast_audio scripts.test_podcast_audio_pronunciation
      - name: Check Windows manager Python syntax
        run: python3 -m py_compile windows/podcast-ahenk/podcast_ahenk_gui.py windows/podcast-ahenk/simple_manager.py windows/podcast-ahenk/audio_inventory.py scripts/podcast_audio_pronunciation.py
      - name: Ensure bundled open-source runtime has required files
        run: |
          test -f public/ahenk-cep/js/worker.js
          test -f public/ahenk-cep/py/trnorm/normalizer.py
          test -f public/ahenk-cep/LICENSE
          test -f public/ahenk-cep/NOTICE
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://metinciris.com.tr
          BLOG_REPO_OWNER: metinciris
          BLOG_REPO_NAME: metinciriscomtr
          BLOG_LABEL: Blog
          BLOG_POSTS_PER_PAGE: 9
      - name: Verify output
        run: npm run verify:build

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell installer with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "windows/podcast-ahenk/kurulum.ps1",
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Host
            throw "Podcast Ahenk kurulum.ps1 parse error"
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Check Python 3.13 detection without modifying files
        shell: powershell
        run: |
          & .\windows\podcast-ahenk\kurulum.ps1 -PythonVersion 3.13 -CheckPythonOnly
          if (-not $?) { throw "Python 3.13 detection failed" }
      - name: Validate installer runner on Windows
        shell: powershell
        run: |
          & python.exe -m py_compile .\windows\podcast-ahenk\git_sync.py
          & .\windows\podcast-ahenk\test_install_runner.ps1
          if (-not $?) { throw 'Ahenk installer runner regression' }
      - name: Regression - pythonw streams and safe logging
        shell: powershell
        run: |
          & python.exe .\windows\podcast-ahenk\test_stdio_guard.py
          if ($LASTEXITCODE -ne 0) { throw "pythonw stream guard regression" }
      - name: Regression - 79 local MP3s, Git porcelain, selected publishing
        shell: powershell
        run: |
          & python.exe .\windows\podcast-ahenk\test_git_sync.py
          if ($LASTEXITCODE -ne 0) { throw "Podcast Ahenk GitHub audio sync regression failed" }
      - name: Regression - simple Windows GUI and local MP3 recovery
        shell: powershell
        run: |
          & python.exe .\windows\podcast-ahenk\test_audio_inventory.py
          if ($LASTEXITCODE -ne 0) { throw "Ahenk audio inventory tests failed" }
          & python.exe .\windows\podcast-ahenk\test_simple_gui.py
          if ($LASTEXITCODE -ne 0) { throw "Ahenk responsive 120-article GUI test failed" }
          & python.exe -c "import sys; sys.path.insert(0, 'windows/podcast-ahenk'); import tkinter as tk; from unittest.mock import patch; import simple_manager as ui; root=tk.Tk(); root.withdraw(); app=ui.AhenkManager(root); root.update_idletasks(); assert hasattr(app, 'btn_publish_one') and hasattr(app, 'table'); assert not app.busy; root.destroy(); print('Ahenk simple GUI responsive OK')"
          if ($LASTEXITCODE -ne 0) { throw "Ahenk simple GUI startup failed" }
      - name: Windows Tkinter interface smoke test
        shell: powershell
        run: |
          & python.exe -c "import sys; sys.path.insert(0, 'windows/podcast-ahenk'); import tkinter as tk; import podcast_ahenk_gui as ui; root=tk.Tk(); root.withdraw(); app=ui.App(root); root.update_idletasks(); assert hasattr(app, 'btn_preview') and hasattr(app, 'model_status'); root.destroy(); print('Ahenk Tkinter UI OK')"
          if ($LASTEXITCODE -ne 0) { throw "Tkinter user interface smoke test failed" }
