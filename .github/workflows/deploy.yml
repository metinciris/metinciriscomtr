name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  issues:
    types:
      - edited
      - closed
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1,4'

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' && (
        (github.event.action == 'labeled' && github.event.label.name == 'Blog') ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'Blog') ||
        ((github.event.action == 'edited' || github.event.action == 'closed' || github.event.action == 'reopened') && contains(github.event.issue.labels.*.name, 'Blog'))
      ))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://metinciris.com.tr
          BLOG_REPO_OWNER: metinciris
          BLOG_REPO_NAME: metinciriscomtr
          BLOG_LABEL: Blog
          BLOG_POSTS_PER_PAGE: 12
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_SAVE_SUB_URL: ${{ secrets.VITE_SAVE_SUB_URL }}
          VITE_SEND_PUSH_URL: ${{ secrets.VITE_SEND_PUSH_URL }}
          VITE_PUBMED_API_KEY: ${{ secrets.VITE_PUBMED_API_KEY }}
          VITE_GITHUB_REPO_OWNER: ${{ secrets.VITE_GITHUB_REPO_OWNER }}
          VITE_GITHUB_REPO_NAME: ${{ secrets.VITE_GITHUB_REPO_NAME }}
          VITE_API_RATE_LIMIT: ${{ secrets.VITE_API_RATE_LIMIT }}

      - name: Verify build
        run: npm run verify:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
