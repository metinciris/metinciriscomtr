<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönlendiriliyor... | Prof Dr Metin Çiriş</title>
    <!-- GitHub Pages SPA Redirect Script -->
    <!-- This script handles client-side routing for Single Page Applications on GitHub Pages -->
    <script>
        // GitHub Pages 404 -> SPA redirect
        // Path'i sessionStorage'a kaydet ve ana sayfaya yönlendir
        (function () {
            var path = window.location.pathname;
            var search = window.location.search;

            // Eğer zaten kök dizindeyse yönlendirme yapma
            if (path === '/' || path === '/index.html') {
                return;
            }

            // Path'i session storage'a kaydet
            sessionStorage.setItem('spa-redirect-path', path + search);

            // Ana sayfaya yönlendir
            window.location.replace('/');
        })();
    </script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .loader {
            text-align: center;
            color: #64748b;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Yönlendiriliyor...</p>
    </div>

    <!-- Fallback: Eğer JavaScript çalışmazsa -->
    <noscript>
        <meta http-equiv="refresh" content="0;url=/">
        <p>Anasayfaya yönlendiriliyorsunuz... <a href="/">Tıklayın</a></p>
    </noscript>
</body>

</html>
