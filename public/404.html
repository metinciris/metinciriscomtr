<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönlendiriliyor... | Prof Dr Metin Çiriş</title>

    <!-- 
        GitHub Pages SPA Redirect Script
        Bu sayfa geçerli route'ları (sjogren-raporlama gibi) ana uygulamaya yönlendirir.
        Gerçek 404 hataları için App.tsx'teki NotFound bileşeni kullanılır.
    -->
    <meta name="robots" content="noindex, nofollow">

    <script>
        // GitHub Pages SPA redirect
        (function () {
            var path = window.location.pathname;
            var search = window.location.search;

            // Kök dizindeyse yönlendirme yapma
            if (path === '/' || path === '/index.html') {
                return;
            }

            // Path'i session storage'a kaydet ve ana sayfaya yönlendir
            sessionStorage.setItem('spa-redirect-path', path + search);
            window.location.replace(window.location.origin + '/');
        })();
    </script>

    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .loader {
            text-align: center;
            color: white;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Yönlendiriliyor...</p>
    </div>

    <!-- JavaScript çalışmazsa -->
    <noscript>
        <meta http-equiv="refresh" content="0;url=/">
        <p>Anasayfaya yönlendiriliyorsunuz... <a href="/">Tıklayın</a></p>
    </noscript>
</body>

</html>
