<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e2449">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Bir Aşk Hikâyesi ❤️ 19 Şubat 2000</title>
  <meta name="description" content="19 Şubat 2000'de evliliğimizle başlayan aşk hikâyemiz.">
  <!-- Özgün, statik uyarlama. İlham: https://github.com/aycanozarpaci/Sevgi-Sayar-Sevgili-Script -->
  <style>
    :root {
      color-scheme: dark;
      --ink: #fcf8ff;
      --muted: #c9bfd9;
      --gold: #f6d681;
      --rose: #ff9fb6;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 28px 18px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 15% 17%, rgba(202, 127, 169, .24), transparent 42%),
        radial-gradient(ellipse at 85% 85%, rgba(114, 93, 178, .28), transparent 47%),
        linear-gradient(135deg, #211a36, #38264e 48%, #241b3c);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .35;
      background-image: radial-gradient(#f5e4f1 0.7px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, #000, transparent 95%);
    }
    .shell {
      position: relative;
      width: min(100%, 670px);
      padding: clamp(26px, 7vw, 56px) clamp(18px, 6vw, 52px) 25px;
      text-align: center;
      border-radius: 30px;
      background: linear-gradient(165deg, rgba(255,255,255,.105), rgba(255,255,255,.028));
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 25px 75px rgba(10, 6, 29, .35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
    }
    .shell::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,231,204,.6), transparent);
    }
    .eyebrow {
      margin: 0 0 15px;
      color: var(--gold);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .heart-frame {
      width: 116px;
      height: 116px;
      margin: 0 auto 21px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255,222,226,.26), rgba(238,114,151,.09) 70%);
      border: 1px solid rgba(255,192,209,.3);
      box-shadow: 0 0 50px rgba(251, 135, 166, .1);
    }
    .heart-frame svg {
      width: 64px;
      height: 64px;
      filter: drop-shadow(0 8px 12px rgba(244,95,141,.25));
      animation: heartbeat 4s ease-in-out infinite;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.9rem, 5.5vw, 3rem);
      line-height: 1.2;
      font-weight: 500;
      letter-spacing: -.025em;
    }
    .intro {
      max-width: 460px;
      margin: 16px auto 27px;
      line-height: 1.65;
      font-size: clamp(.94rem, 2.7vw, 1.07rem);
      color: var(--muted);
    }
    .intro strong { color: #fff2d6; font-weight: 600; }
    .counter {
      padding: 25px 15px 24px;
      border-radius: 21px;
      background: rgba(19, 14, 38, .32);
      border: 1px solid rgba(255,255,255,.11);
    }
    .counter-title {
      margin: 0 0 13px;
      color: var(--muted);
      font-size: .82rem;
      letter-spacing: .07em;
    }
    .days {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2.7fr) minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(5px, 1.3vw, 12px);
    }
    .day {
      display: block;
      min-width: 0;
      text-align: center;
      white-space: nowrap;
      font-size: clamp(.74rem, 1.8vw, 1.05rem);
      letter-spacing: -.04em;
      font-variant-numeric: tabular-nums;
      color: #ada4be;
      opacity: .75;
    }
    .day.near { color: #e0d6e9; opacity: .95; }
    .day.today {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -.07em;
      color: var(--gold);
      opacity: 1;
      text-shadow: 0 0 32px rgba(246, 214, 129, .24);
    }
    .day-caption {
      margin: 6px 0 0;
      color: var(--gold);
      font-size: .75rem;
      letter-spacing: .19em;
      text-transform: uppercase;
    }
    .duration {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 10px;
      margin: 22px auto 0;
      max-width: 360px;
    }
    .duration > div {
      flex: 1;
      min-width: 0;
      padding: 12px 6px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,.07);
    }
    .duration strong {
      display: block;
      color: #fff9ec;
      font-size: clamp(1.22rem, 4vw, 1.7rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .duration span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .1em;
    }
    .anniversary {
      min-height: 1.3em;
      margin: 19px 0 0;
      font-size: .84rem;
      color: #e6d9eb;
    }
    .wish-button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 29px;
      padding: 13px 28px;
      min-height: 48px;
      border-radius: 999px;
      border: 1px solid rgba(255,206,220,.45);
      background: linear-gradient(135deg, #a74c77, #7e467a);
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(17, 6, 36, .23);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .wish-button:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 13px 30px rgba(17,6,36,.28); }
    .wish-button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 5px; }
    .wish-button:disabled { cursor: default; opacity: .88; }
    .wish-note { min-height: 1.35em; margin: 12px 0 0; color: #ffe3eb; font-size: .88rem; }
    .footnote { margin: 25px 0 0; color: #bdafce; font-size: .8rem; }
    .back-link {
      display: inline-block;
      margin-top: 14px;
      color: #decfe8;
      font-size: .82rem;
      text-decoration-color: rgba(222,207,232,.5);
      text-underline-offset: 4px;
    }
    .back-link:hover { color: #fff; }
    .floating-hearts { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .floating-heart {
      position: absolute;
      left: 50%;
      bottom: 90px;
      font-size: 1.5rem;
      color: #ffb6ca;
      opacity: 0;
      animation: float-heart 2.2s ease-out forwards;
    }
    @keyframes heartbeat { 0%, 86%, 100% { transform: scale(1); } 90%, 96% { transform: scale(1.075); } }
    @keyframes float-heart {
      0% { transform: translate(0, 0) scale(.7); opacity: 0; }
      14% { opacity: .95; }
      100% { transform: translate(var(--move-x), -225px) scale(1.25); opacity: 0; }
    }
    /* Üçlü sayaç mobilde ortadaki büyük sayıya kendi alanını verir. */
    @media (max-width: 600px) {
      .days {
        grid-template-columns: minmax(0, 1fr) minmax(0, 2.6fr) minmax(0, 1fr);
        gap: clamp(4px, 1.2vw, 8px);
      }
      #day-minus-two, #day-plus-two { display: none; }
      .day { font-size: clamp(.72rem, 2.7vw, .94rem); }
      .day.today { font-size: clamp(2.2rem, 10vw, 3.5rem); }
    }
    @media (max-width: 380px) {
      body { padding: 12px; }
      .shell { padding: 28px 12px 22px; border-radius: 22px; }
      .counter { padding: 19px 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">Bizim küçük köşemiz</p>
    <div class="heart-frame" aria-hidden="true">
      <svg viewBox="0 0 80 80" role="presentation" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 68.5C20 54.9 9 43.8 9 30.4 9 21.8 15.6 15 24.2 15c7 0 12 3.6 15.8 9 3.8-5.4 8.8-9 15.8-9C64.4 15 71 21.8 71 30.4c0 13.4-11 24.5-31 38.1Z" fill="#FFA7BF" stroke="#FFE2E8" stroke-width="2.5"/>
        <path d="M20 29c1.5-5.4 5.6-8.2 10-8.2" stroke="#FFE9EE" stroke-width="3" stroke-linecap="round" opacity=".9"/>
      </svg>
    </div>
    <h1>Bir aşk hikâyesi.</h1>
    <p class="intro"><strong>19 Şubat 2000</strong>'de evlendik. O günden beri her gün, aşk hikâyemize yeni bir hatıra ekliyoruz…</p>

    <section class="counter" aria-label="Birlikte geçen süre">
      <p class="counter-title">Evliliğimizde birlikte geçen günler</p>
      <div class="days" aria-label="Toplam gün sayısı">
        <span class="day" id="day-minus-two" aria-hidden="true">—</span>
        <span class="day near" id="day-minus-one" aria-hidden="true">—</span>
        <strong class="day today" id="day-today">—</strong>
        <span class="day near" id="day-plus-one" aria-hidden="true">—</span>
        <span class="day" id="day-plus-two" aria-hidden="true">—</span>
      </div>
      <p class="day-caption">gün</p>
      <div class="duration" aria-label="Yıl, ay ve gün olarak birlikte geçen süre">
        <div><strong id="years">—</strong><span>YIL</span></div>
        <div><strong id="months">—</strong><span>AY</span></div>
        <div><strong id="days">—</strong><span>GÜN</span></div>
      </div>
      <p class="anniversary" id="anniversary"></p>
    </section>

    <button class="wish-button" id="wish-button" type="button">Mutluluklar dile <span aria-hidden="true">♡</span></button>
    <p class="wish-note" id="wish-note" role="status" aria-live="polite"></p>
    <p class="footnote">Nice güzel yıllara, el ele. ♡</p>
    <a class="back-link" href="/">← Ana sayfaya dön</a>
    <div class="floating-hearts" id="floating-hearts" aria-hidden="true"></div>
  </main>

  <script>
    (function () {
      'use strict';
      // Gün hesabı ziyaretçinin cihazına değil, Türkiye takvim gününe göre yapılır.
      var start = { year: 2000, month: 2, day: 19 };
      var dayMs = 86400000;
      var formatter = new Intl.NumberFormat('tr-TR');

      function istanbulDate() {
        var parts = new Intl.DateTimeFormat('en-US', {
          timeZone: 'Europe/Istanbul', year: 'numeric', month: 'numeric', day: 'numeric'
        }).formatToParts(new Date());
        var result = {};
        parts.forEach(function (item) {
          if (item.type === 'year' || item.type === 'month' || item.type === 'day') {
            result[item.type] = Number(item.value);
          }
        });
        return result;
      }

      function renderCounter() {
        var now = istanbulDate();
        var total = Math.max(0, Math.round((
          Date.UTC(now.year, now.month - 1, now.day) - Date.UTC(start.year, start.month - 1, start.day)
        ) / dayMs));

        var years = now.year - start.year;
        var months = now.month - start.month;
        var days = now.day - start.day;
        if (days < 0) {
          months -= 1;
          days += new Date(Date.UTC(now.year, now.month - 1, 0)).getUTCDate();
        }
        if (months < 0) {
          years -= 1;
          months += 12;
        }
        if (total === 0 && years < 0) { years = 0; months = 0; days = 0; }

        [-2, -1, 0, 1, 2].forEach(function (offset) {
          var suffix = offset === -2 ? 'minus-two' : offset === -1 ? 'minus-one' :
            offset === 0 ? 'today' : offset === 1 ? 'plus-one' : 'plus-two';
          document.getElementById('day-' + suffix).textContent = formatter.format(Math.max(0, total + offset));
        });
        document.getElementById('years').textContent = years;
        document.getElementById('months').textContent = months;
        document.getElementById('days').textContent = days;
        document.getElementById('day-today').setAttribute('aria-label', formatter.format(total) + ' gün');

        var thisAnniversary = Date.UTC(now.year, 1, 19);
        var todayUTC = Date.UTC(now.year, now.month - 1, now.day);
        var target = thisAnniversary < todayUTC ? Date.UTC(now.year + 1, 1, 19) : thisAnniversary;
        var remaining = Math.round((target - todayUTC) / dayMs);
        // Türkiye takvimine göre: 17.11.2026 -> 19.02.2027 = 94 gün.
        // Hedef tarihi de açık yazarak hangi yıldönümünün sayıldığını gösterir.
        var anniversaryYear = thisAnniversary < todayUTC ? now.year + 1 : now.year;
        document.getElementById('anniversary').textContent = remaining === 0
          ? 'Bugün evlilik yıldönümümüz! ❤️'
          : 'Bir sonraki evlilik yıldönümümüz: 19 Şubat ' + anniversaryYear +
            ' · ' + formatter.format(remaining) + ' gün kaldı.';
      }

      renderCounter();
      window.setInterval(renderCounter, 60000);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) renderCounter();
      });

      document.getElementById('wish-button').addEventListener('click', function () {
        var button = this;
        button.disabled = true;
        button.textContent = 'İyi ki varsınız ♥';
        document.getElementById('wish-note').textContent = 'Güzel dileğin için teşekkürler! 💕';

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var container = document.getElementById('floating-hearts');
        for (var i = 0; i < 12; i++) {
          var heart = document.createElement('span');
          heart.className = 'floating-heart';
          heart.textContent = i % 3 === 0 ? '♡' : '♥';
          heart.style.left = (18 + Math.random() * 64) + '%';
          heart.style.setProperty('--move-x', (Math.random() * 130 - 65) + 'px');
          heart.style.animationDelay = (i * 0.09) + 's';
          heart.addEventListener('animationend', function () { this.remove(); }, { once: true });
          container.appendChild(heart);
        }
      });
    })();
  </script>
</body>
</html>
